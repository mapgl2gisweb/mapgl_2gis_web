<!DOCTYPE html>
<html>
<head>
    <base href="$FLUTTER_BASE_HREF">

    <!-- Network optimization hints for the 2GIS MapGL API -->
    <link rel="preconnect" href="https://mapgl.2gis.com" crossorigin>
    <link rel="preconnect" href="https://tile0-sdk.maps.2gis.com" crossorigin>
    <link rel="preconnect" href="https://tile1-sdk.maps.2gis.com" crossorigin>
    <link rel="preconnect" href="https://styles.api.2gis.com" crossorigin>
    <link rel="preconnect" href="https://keys.api.2gis.com" crossorigin>

    <link rel="preload" href="https://mapgl.2gis.com/api/js/v1" as="script">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="A new Flutter project.">

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="test_2gis_map">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png"/>

    <title>test_2gis_map</title>
    <link rel="manifest" href="manifest.json">

    <!-- Splash screen styles -->
    <style>
        #splash-screen {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: linear-gradient(135deg, #0d47a1, #7b1fa2);
          color: white;
          font-family: Arial, sans-serif;
          font-size: 2rem;
          z-index: 9999;
          transition: opacity 0.3s ease-out;
        }

        #splash-screen .app-name {
          margin-bottom: 10px;
        }

        .loader {
          width: 30px;
          height: 30px;
          margin-top: 10px;
          border: 3px solid rgba(255, 255, 255, 0.3);
          border-top-color: #fff;
          border-radius: 50%;
          animation: spin 1s linear infinite;
        }

        @keyframes spin {
          to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<!-- Splash screen -->
<div id="splash-screen">
    <div class="app-name">Loading...</div>
    <div class="loader"></div>
</div>

<script src="flutter_bootstrap.js" async></script>
</body>
</html>
